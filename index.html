<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FORGE — Street workout</title>
  <meta name="description" content="Suivi street workout et alimentation, hors connexion.">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs" hidden>
    <a href="#/today" data-tab="today"><span>🏠</span>Aujourd'hui</a>
    <a href="#/seance" data-tab="seance"><span>💪</span>Séance</a>
    <a href="#/bilan" data-tab="bilan"><span>📈</span>Bilan</a>
    <a href="#/manger" data-tab="manger"><span>🍽️</span>Manger</a>
  </nav>
  <div id="session" hidden></div>
  <div id="sheet" hidden><div id="sheet-box"></div></div>
  <div id="toast" hidden></div>
  <input type="file" id="file-img" accept="image/*" hidden>
  <input type="file" id="file-json" accept="application/json,.json" hidden>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/session.js"></script>
  <script>
    boot();
    if ("serviceWorker" in navigator) {
      const had = !!navigator.serviceWorker.controller;
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      // Nouvelle version installée : on recharge une seule fois, sauf pendant une séance
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!had || reloaded) return;
        reloaded = true;
        if (!S.current) location.reload();
      });
    }
  </script>
</body>
</html>
